<script>
  async function responder() {
    const input = document.getElementById("userInput");
    const chatLog = document.getElementById("chatLog");
    const pregunta = input.value.trim();

    if (!pregunta) return;

    const userMsg = document.createElement("div");
    userMsg.className = "bubble user";
    userMsg.innerText = pregunta;
    chatLog.appendChild(userMsg);

    input.value = "";
    input.focus();
    chatLog.scrollTop = chatLog.scrollHeight;

    try {
      const res = await fetch("/preguntar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pregunta })
      });

      const data = await res.json();
      const respuesta = document.createElement("div");
      respuesta.className = "bubble bot";
      respuesta.innerText = data.respuesta;
      chatLog.appendChild(respuesta);
      chatLog.scrollTop = chatLog.scrollHeight;
    } catch (error) {
      const errorMsg = document.createElement("div");
      errorMsg.className = "bubble bot";
      errorMsg.innerText = "Hubo un error al conectar con el servidor.";
      chatLog.appendChild(errorMsg);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  }
</script>
