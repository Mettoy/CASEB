<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CASEB - Asistente IA</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #00bcd4;
      color: white;
      padding: 1rem;
      font-size: 1.4rem;
      text-align: center;
    }
    .chat {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 15px;
      background: #fff;
    }
    .user { align-self: flex-end; background: #daf5ff; }
    .bot  { align-self: flex-start; background: #e8e8e8; }
    .input-container {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ccc;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      margin-left: 10px;
      padding: 10px 20px;
      background: #00bcd4;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>🤖 CASEB - Asistente IA</header>
  <div class="chat" id="chat"></div>
  <div class="input-container">
    <input type="text" id="userInput" placeholder="Pregúntame algo..." />
    <button onclick="buscar()">Enviar</button>
  </div>

  <script>
    const apiKey = AIzaSyDIsTCKBN99S8IHBLFS8UCdYZayfVz8Kh8;
    const cx = 904bcd94bb97648e1;

    async function buscar() {
      const input = document.getElementById("userInput");
      const pregunta = input.value.trim();
      if (!pregunta) return;

      agregarMensaje(pregunta, "user");
      input.value = "";

      try {
        const url = `https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(pregunta)}&key=${apiKey}&cx=${cx}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.items && data.items.length > 0) {
          let respuesta = "";
          data.items.slice(0, 2).forEach(item => {
            respuesta += `<strong>${item.title}</strong><br>${item.snippet}<br><a href="${item.link}" target="_blank">${item.link}</a><br><br>`;
          });
          agregarMensaje(respuesta, "bot", true);
        } else {
          agregarMensaje("No encontré resultados relevantes. 😕", "bot");
        }
      } catch (e) {
        agregarMensaje("❌ Error al consultar Google.", "bot");
      }
    }

    function agregarMensaje(texto, tipo, esHTML = false) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = `bubble ${tipo}`;
      div.innerHTML = esHTML ? texto : escapeHtml(texto);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    document.getElementById("userInput").addEventListener("keydown", e => {
      if (e.key === "Enter") buscar();
    });
  </script>
</body>
</html>
