<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CASEB - IA Simulada</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f2027;
      background-image: linear-gradient(to right, #2c5364, #203a43, #0f2027);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 30px;
      width: 400px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ffe7;
    }

    .chat-log {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #00ffe7;
      padding: 10px;
      margin-bottom: 15px;
      background-color: #1c1f26;
      border-radius: 10px;
      font-size: 14px;
    }

    .chat-log p {
      margin: 6px 0;
    }

    input[type="text"] {
      width: 75%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #00ffe7;
      background-color: #1e272e;
      color: #00ffe7;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: #00ffe7;
      color: #000;
      cursor: pointer;
      margin-left: 5px;
    }

    button:hover {
      background-color: #01d1c1;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #00ffe7;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <h2>CASEB - IA Simulada</h2>
    <div class="chat-log" id="chatLog">
      <p><strong>CASEB:</strong> ¡Hola! Soy tu asistente. Pregúntame algo.</p>
    </div>
    <input type="text" id="userInput" placeholder="Escribe tu pregunta...">
    <button onclick="responder()">Enviar</button>
  </div>

  <script>
    function responder() {
      const input = document.getElementById("userInput");
      const chatLog = document.getElementById("chatLog");
      const pregunta = input.value.trim().toLowerCase();
      if (pregunta === "") return;

      const respuesta = generarRespuesta(pregunta);

      chatLog.innerHTML += `<p><strong>Tú:</strong> ${input.value}</p>`;
      chatLog.innerHTML += `<p><strong>CASEB:</strong> ${respuesta}</p>`;
      input.value = "";
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function generarRespuesta(texto) {
      if (texto.includes("hola") || texto.includes("buenas")) {
        return "¡Hola! ¿En qué puedo ayudarte?";
      } else if (texto.includes("nombre")) {
        return "Me llamo CASEB, tu IA simulada.";
      } else if (texto.includes("hora")) {
        return "La hora actual es: " + new Date().toLocaleTimeString();
      } else if (texto.includes("clima")) {
        return "No tengo conexión a internet, pero te recomiendo verificar en un sitio de clima confiable.";
      } else if (texto.includes("gracias")) {
        return "¡Con gusto! 😊";
      } else if (texto.includes("adiós") || texto.includes("bye")) {
        return "¡Hasta luego! 👋";
      } else {
        return "Hmm... no entendí eso. ¿Podrías reformular tu pregunta?";
      }
    }
  </script>

</body>
</html>
