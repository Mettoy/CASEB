<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASEB - IA Futurista</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      background-image: linear-gradient(to right, #2c5364, #203a43, #0f2027);
      color: #00ffe7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      background: rgba(0, 0, 0, 0.8);
      width: 100%;
      max-width: 800px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ffe7;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    h2 {
      text-align: center;
      color: #00ffe7;
      margin-bottom: 20px;
    }

    .chat-log {
      height: 350px;
      overflow-y: auto;
      margin-bottom: 20px;
      background-color: #1e1e1e;
      border: 1px solid #00ffe7;
      border-radius: 10px;
      padding: 15px;
      font-size: 14px;
      color: #b2dfdb;
      display: flex;
      flex-direction: column;
    }

    .chat-log p {
      margin: 5px 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #00ffe7;
      background-color: #1c1f26;
      color: #00ffe7;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background-color: #00ffe7;
      color: #000;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #01d1c1;
    }

    /* Responsive for mobile */
    @media (max-width: 768px) {
      .chat-container {
        width: 90%;
        padding: 15px;
      }

      input[type="text"] {
        font-size: 14px;
      }

      button {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      h2 {
        font-size: 20px;
      }

      .chat-log {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <h2>CASEB - IA Futurista</h2>
    <div class="chat-log" id="chatLog">
      <p><strong>CASEB:</strong> ¡Hola! Soy CASEB, tu IA avanzada. ¿Cómo puedo ayudarte?</p>
    </div>
    <input type="text" id="userInput" placeholder="Escribe tu pregunta...">
    <button onclick="responder()">Enviar</button>
  </div>

  <script>
    function responder() {
      const input = document.getElementById("userInput");
      const chatLog = document.getElementById("chatLog");
      const pregunta = input.value.trim().toLowerCase();

      if (pregunta === "") return;

      const respuesta = generarRespuesta(pregunta);

      chatLog.innerHTML += `<p><strong>Tú:</strong> ${input.value}</p>`;
      chatLog.innerHTML += `<p><strong>CASEB:</strong> ${respuesta}</p>`;
      input.value = "";
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function generarRespuesta(texto) {
      if (texto.includes("hola") || texto.includes("buenas")) {
        return "¡Hola! ¿En qué puedo ayudarte hoy?";
      } else if (texto.includes("nombre")) {
        return "Me llamo CASEB, tu IA avanzada y futurista.";
      } else if (texto.includes("hora")) {
        return "La hora actual es: " + new Date().toLocaleTimeString();
      } else if (texto.includes("clima")) {
        return "No tengo conexión a internet, pero te recomiendo verificar en un sitio de clima confiable.";
      } else if (texto.includes("gracias")) {
        return "¡Con gusto! 😊";
      } else if (texto.includes("adiós") || texto.includes("bye")) {
        return "¡Hasta luego! 👋";
      } else {
        return "Hmm... no entendí eso. ¿Podrías reformular tu pregunta?";
      }
    }
  </script>

</body>
</html>
