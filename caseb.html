<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CASEB - IA Futurista</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f2027;
      background-image: linear-gradient(to right, #2c5364, #203a43, #0f2027);
      color: #00ffe7;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(0, 0, 0, 0.85);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ffe7;
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #00ffe7;
    }

    .chat-log {
      height: 350px;
      overflow-y: auto;
      background-color: #1c1f26;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #00ffe7;
      margin-bottom: 15px;
      font-size: 14px;
      color: #b2dfdb;
    }

    .chat-log p {
      margin: 10px 0;
    }

    input[type="text"] {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      background-color: #0d1117;
      color: #00ffe7;
      border: 1px solid #00ffe7;
    }

    button {
      padding: 12px;
      font-size: 16px;
      background-color: #00ffe7;
      border: none;
      color: #000;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #01d1c1;
    }

    a {
      color: #1ecbe1;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 CASEB - Asistente IA</h1>
    <div class="chat-log" id="chatLog">
      <p><strong>CASEB:</strong> ¡Hola! Soy CASEB. Pregúntame lo que quieras, TODAVIA SOY UN MODELO DE PRUEBA 🤖</p>
    </div>
    <input type="text" id="userInput" placeholder="Escribe tu pregunta aquí..." />
    <button onclick="responder()">Enviar</button>
  </div>

  <script>
    const apiKey = "AIzaSyDIsTCKBN99S8IHBLFS8UCdYZayfVz8Kh8"; // 🔐 
    const cx = "904bcd94bb97648e1"; // ✅ Tu motor de búsqueda personalizado

    async function responder() {
      const input = document.getElementById("userInput");
      const chatLog = document.getElementById("chatLog");
      const pregunta = input.value.trim();

      if (!pregunta) return;

      chatLog.innerHTML += `<p><strong>Tú:</strong> ${pregunta}</p>`;
      input.value = "";
      chatLog.scrollTop = chatLog.scrollHeight;

      // Filtro de temas prohibidos
      if (/pol[ií]tica|presidente|elecciones|sexo|violencia/i.test(pregunta)) {
        chatLog.innerHTML += `<p><strong>CASEB:</strong> Lo siento, no puedo responder preguntas sobre ese tema.</p>`;
        chatLog.scrollTop = chatLog.scrollHeight;
        return;
      }

      const respuesta = await buscarEnGoogle(pregunta);
      chatLog.innerHTML += `<p><strong>CASEB:</strong> ${respuesta}</p>`;
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function buscarEnGoogle(query) {
      const url = `https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(query)}&key=${apiKey}&cx=${cx}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.items && data.items.length > 0) {
          const item = data.items[0];
          return `He encontrado esto que podría ayudarte: <strong>${item.title}</strong>. Puedes leer más aquí: <a href="${item.link}" target="_blank">${item.link}</a>`;
        } else {
          return "No encontré información clara sobre eso, ¿puedes reformular la pregunta?";
        }
      } catch (error) {
        return "Hubo un error al buscar tu respuesta. Intenta de nuevo más tarde.";
      }
    }
  </script>
</body>
</html>
